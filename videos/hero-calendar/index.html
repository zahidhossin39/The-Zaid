<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"theme","type":"enum","label":"Theme","default":"light","options":[{"value":"light","label":"Light (hero)"},{"value":"dark","label":"Dark (social)"}]}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1264, height=704" />
    <title>The calendar that fills itself</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Instrument+Serif:ital@1&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
    <style>
      /* Palette: every colour lives here. Amber is the only accent. */
      :root {
        --bg: #ffffff;
        --ink: #0a0a0b;
        --soft: #3a3936;
        --muted: #85827b;
        --surface: #f4f2ed;
        --bar: #e3e0d8;
        --border: #e6e4de;
        --card: #ffffff;
        --night: #0a0a0b;
        --night-ink: #f4f2ed;
        --night-muted: #9c9a94;
        --accent: #ffa524;
        --shadow: 0 18px 40px -18px rgba(10, 10, 11, 0.28);
      }
      :root[data-theme="dark"] {
        --bg: #0a0a0b;
        --ink: #f4f2ed;
        --soft: #c9c6bf;
        --muted: #8f8c85;
        --surface: #1a1a1c;
        --bar: #2c2c30;
        --border: #2a2a2d;
        --card: #151517;
        --night: #232327;
        --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.8);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1264px; height: 704px; overflow: hidden; background: var(--bg); }
      #stage {
        position: relative;
        width: 1264px;
        height: 704px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Inter Tight", system-ui, sans-serif;
        font-size: 44px;
        letter-spacing: -0.02em;
        color: var(--ink);
      }
      #scene { position: absolute; inset: 0; }
      .abs { position: absolute; }

      /* Week grid: gutter 44-160, columns 214 wide at x 176/402/628, rows 176 tall at y 112/300/488 */
      .day, .time { font-weight: 600; color: var(--soft); line-height: 1; }
      .day { top: 44px; width: 214px; text-align: center; }
      .time { left: 20px; width: 140px; text-align: right; padding-top: 16px; font-weight: 500; color: var(--muted); }

      .slot {
        width: 214px;
        height: 176px;
        border-radius: 18px;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        inset: 0;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Pre-booked: plain block with two placeholder bars (name + service), no words */
      .booked { background: var(--surface); flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 14px; padding: 30px 26px; }
      .booked i { display: block; height: 16px; border-radius: 8px; background: var(--bar); }
      .booked i:nth-child(1) { width: 120px; }
      .booked i:nth-child(2) { width: 78px; }
      .amber { background: var(--accent); color: #0a0a0b; font-weight: 600; }
      .open-lbl { color: var(--muted); font-weight: 500; }
      .cancelled { background: var(--bg); border: 3px dashed var(--muted); color: var(--muted); font-weight: 500; text-decoration: line-through; text-decoration-thickness: 3px; }
      .off-ring { border: 3px solid var(--border); }
      .off-fill { background: var(--accent); transform-origin: 50% 100%; }
      .off-word {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 80px;
        letter-spacing: 0;
        color: var(--muted);
      }

      /* Rail: one incoming event at a time */
      .card {
        left: 874px;
        top: 278px;
        width: 346px;
        height: 220px;
        padding: 24px 28px;
        border-radius: 22px;
        background: var(--card);
        border: 2px solid var(--border);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        line-height: 1;
      }
      .card.night { background: var(--night); border-color: var(--night); color: var(--night-ink); }
      .card .meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-weight: 500; }
      .card.night .meta { color: var(--night-muted); }
      .card .title { font-weight: 700; }
      .card .outcome { display: flex; align-items: center; gap: 12px; font-weight: 600; }
      .ico { width: 44px; height: 44px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .card .meta .ico { color: var(--soft); }
      .card.night .meta .ico { color: var(--night-ink); }
      .moon { width: 34px; height: 34px; color: var(--accent); stroke: none; fill: currentColor; }
      .tick { width: 40px; height: 40px; stroke-width: 3; }

      .week-full { font-size: 54px; left: 874px; top: 356px; width: 346px; display: flex; align-items: center; justify-content: center; gap: 14px; font-weight: 700; line-height: 1; }

      /* Overlay for dashed outlines and flight paths, in canvas coordinates */
      #paths { position: absolute; inset: 0; width: 1264px; height: 704px; overflow: visible; }
      .dash { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 14 10; }
      .route { fill: none; stroke: var(--muted); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 0 16; }
      .reveal { fill: none; stroke: #fff; stroke-width: 14; stroke-dasharray: 1 1; }

      .chip {
        left: 0;
        top: 0;
        padding: 16px 30px;
        border-radius: 999px;
        background: var(--accent);
        color: #0a0a0b;
        font-weight: 600;
        line-height: 1;
        box-shadow: 0 14px 28px -12px rgba(255, 165, 36, 0.65);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1264" data-height="704">
      <div id="scene">
        <!-- Header + gutter -->
        <div class="abs day" style="left: 176px">Tue</div>
        <div class="abs day" style="left: 402px">Wed</div>
        <div class="abs day" style="left: 628px">Thu</div>
        <div class="abs time" style="top: 112px">9 am</div>
        <div class="abs time" style="top: 300px">12 pm</div>
        <div class="abs time" style="top: 488px">5 pm</div>

        <!-- Row 9 am -->
        <div id="s-tue9" class="abs slot" style="left: 176px; top: 112px">
          <div class="layer open-lbl" id="tue9-open">Open</div>
          <div class="layer amber" id="tue9-amber" style="opacity: 0">Booked</div>
          <div class="layer booked" id="tue9-booked" style="opacity: 0"><i></i><i></i></div>
        </div>
        <div class="abs slot" style="left: 402px; top: 112px"><div class="layer booked"><i></i><i></i></div></div>
        <div class="abs slot" style="left: 628px; top: 112px"><div class="layer booked"><i></i><i></i></div></div>

        <!-- Row 12 pm -->
        <div class="abs slot" style="left: 176px; top: 300px"><div class="layer booked"><i></i><i></i></div></div>
        <div id="s-wed12" class="abs slot" style="left: 402px; top: 300px; overflow: visible">
          <div class="layer booked" id="wed12-booked"><i></i><i></i></div>
          <div class="layer cancelled" id="wed12-cancel" style="opacity: 0">Cancelled</div>
          <div class="layer amber" id="wed12-amber" style="opacity: 0">Booked</div>
          <div class="layer booked" id="wed12-rebooked" style="opacity: 0"><i></i><i></i></div>
        </div>
        <div class="abs slot" style="left: 628px; top: 300px"><div class="layer booked"><i></i><i></i></div></div>

        <!-- Row 5 pm -->
        <div class="abs slot" style="left: 176px; top: 488px"><div class="layer booked"><i></i><i></i></div></div>
        <div id="s-wed5" class="abs slot" style="left: 402px; top: 488px">
          <div class="layer open-lbl" id="wed5-open">Open</div>
          <div class="layer amber" id="wed5-amber" style="opacity: 0">Booked</div>
          <div class="layer booked" id="wed5-booked" style="opacity: 0"><i></i><i></i></div>
        </div>
        <div id="s-thu5" class="abs slot" style="left: 628px; top: 488px">
          <div class="layer off-ring"></div>
          <div class="layer off-fill" id="thu5-fill" style="transform: scaleY(0)"></div>
          <div class="layer"><span class="off-word" id="thu5-word">Off</span></div>
        </div>

        <!-- Dashed outlines (open slots) and flight routes -->
        <svg id="paths" viewBox="0 0 1264 704">
          <defs>
            <mask id="m-dash" maskUnits="userSpaceOnUse" x="0" y="0" width="1264" height="704">
              <rect id="md-tue9" class="reveal" x="177.5" y="113.5" width="211" height="173" rx="17" pathLength="1" stroke-dashoffset="1" />
              <rect id="md-wed5" class="reveal" x="403.5" y="489.5" width="211" height="173" rx="17" pathLength="1" stroke-dashoffset="1" />
            </mask>
            <mask id="m-r1" maskUnits="userSpaceOnUse" x="0" y="0" width="1264" height="704">
              <path id="mr1" class="reveal" d="M874 388 Q600 20 283 200" pathLength="1" stroke-dashoffset="1" />
            </mask>
            <mask id="m-r2" maskUnits="userSpaceOnUse" x="0" y="0" width="1264" height="704">
              <path id="mr2" class="reveal" d="M874 388 Q760 720 509 576" pathLength="1" stroke-dashoffset="1" />
            </mask>
            <mask id="m-r3" maskUnits="userSpaceOnUse" x="0" y="0" width="1264" height="704">
              <path id="mr3" class="reveal" d="M874 388 Q700 190 509 388" pathLength="1" stroke-dashoffset="1" />
            </mask>
          </defs>
          <g mask="url(#m-dash)">
            <rect id="dash-tue9" class="dash" x="177.5" y="113.5" width="211" height="173" rx="17" />
            <rect id="dash-wed5" class="dash" x="403.5" y="489.5" width="211" height="173" rx="17" />
          </g>
          <path id="r1" class="route" d="M874 388 Q600 20 283 200" mask="url(#m-r1)" />
          <path id="r2" class="route" d="M874 388 Q760 720 509 576" mask="url(#m-r2)" />
          <path id="r3" class="route" d="M874 388 Q700 190 509 388" mask="url(#m-r3)" />
        </svg>

        <!-- Travelling bookings -->
        <div id="chip1" class="abs chip" data-layout-allow-overlap data-layout-allow-occlusion style="opacity: 0">Booked</div>
        <div id="chip2" class="abs chip" data-layout-allow-overlap data-layout-allow-occlusion style="opacity: 0">Booked</div>
        <div id="chip3" class="abs chip" data-layout-allow-overlap data-layout-allow-occlusion style="opacity: 0">Booked</div>

        <!-- Rail cards (above the chips, so each booking slides out from behind its card) -->
        <div id="card-call" class="abs card" style="opacity: 0">
          <div class="meta">
            <svg class="ico" viewBox="0 0 24 24"><path d="m16 2 6 6M22 2l-6 6" /><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z" /></svg>
            <span>6:12 pm</span>
          </div>
          <div class="title">Missed call</div>
          <div class="outcome" id="call-out" style="opacity: 0"><svg class="ico tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>Answered</div>
        </div>

        <div id="card-dm" class="abs card night" style="opacity: 0">
          <div class="meta">
            <svg class="ico" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5.5" /><circle cx="12" cy="12" r="4.3" /><path d="M17.5 6.5h.01" /></svg>
            <span>11:48 pm</span>
            <svg class="ico moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
          </div>
          <div class="title">Instagram DM</div>
          <div class="outcome" id="dm-out" style="opacity: 0"><svg class="ico tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>Replied</div>
        </div>

        <div id="card-wait" class="abs card" style="opacity: 0">
          <div class="meta">
            <svg class="ico" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M4 6h1M4 12h1M4 18h1" /></svg>
            <span>Wed 12 pm</span>
          </div>
          <div class="title">Waitlist</div>
          <div class="outcome" id="wait-out" style="opacity: 0"><svg class="ico tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></svg>Next in line</div>
        </div>

        <div id="week-full" class="abs week-full" style="opacity: 0"><svg class="ico tick" viewBox="0 0 24 24" style="width:50px;height:50px"><path id="wf-tick" d="M4 12l5 5L20 6" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" /></svg>Week full</div>

      </div>
    </div>

    <script>
      gsap.registerPlugin(MotionPathPlugin);
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.theme === "dark") document.documentElement.dataset.theme = "dark";

      const IN = "expo.out"; // entrances
      const OUT = "power2.in"; // exits, faster than entrances
      const tl = gsap.timeline({ paused: true });

      // 0.1-0.6 the two open slots outline themselves
      tl.to("#md-tue9", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.to("#md-wed5", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.2);

      // A card slides in from the right, its outcome line appears
      function cardIn(card, outcome, t, outAt) {
        tl.fromTo(card, { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: IN }, t);
        tl.fromTo(outcome, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: IN }, outAt);
      }
      function cardOut(card, t) {
        tl.to(card, { autoAlpha: 0, y: -40, duration: 0.25, ease: OUT }, t);
      }

      // A booking flies from the rail into its slot along a dotted route, then settles to a quiet block
      function fly(chip, route, reveal, t, dur) {
        tl.to(reveal, { strokeDashoffset: 0, duration: dur - 0.1, ease: "power1.inOut" }, t - 0.15);
        tl.fromTo(chip, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: IN }, t);
        tl.to(chip, { motionPath: { path: route, align: route, alignOrigin: [0.5, 0.5] }, duration: dur, ease: "power2.inOut" }, t);
        tl.set(chip, { autoAlpha: 0 }, t + dur);
        tl.to(route, { opacity: 0, duration: 0.3, ease: "power1.out" }, t + dur + 0.05);
      }
      function land(slot, amber, hide, t, ease) {
        tl.set(amber, { opacity: 1 }, t);
        hide.forEach((el) => tl.set(el, { opacity: 0 }, t));
        tl.fromTo(slot, { scale: 0.92 }, { scale: 1, immediateRender: false, duration: ease === "back" ? 0.5 : 0.35, ease: ease === "back" ? "back.out(1.8)" : "power3.out" }, t);
      }
      function settle(layer, amber, t) {
        tl.fromTo(layer, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.inOut" }, t);
        tl.set(amber, { opacity: 0 }, t + 0.4);
      }

      // Beat 2: a missed call at 6:12 pm becomes Tue 9 am
      cardIn("#card-call", "#call-out", 0.8, 1.4);
      fly("#chip1", "#r1", "#mr1", 1.7, 0.6);
      land("#s-tue9", "#tue9-amber", ["#tue9-open", "#dash-tue9"], 2.3);
      cardOut("#card-call", 2.6);
      settle("#tue9-booked", "#tue9-amber", 2.9);

      // Beat 3: an Instagram DM at 11:48 pm becomes Wed 5 pm
      cardIn("#card-dm", "#dm-out", 2.75, 3.25);
      fly("#chip2", "#r2", "#mr2", 3.4, 0.6);
      land("#s-wed5", "#wed5-amber", ["#wed5-open", "#dash-wed5"], 4.0);
      cardOut("#card-dm", 4.3);
      settle("#wed5-booked", "#wed5-amber", 4.6);

      // Beat 4: Wed 12 pm cancels, the waitlist refills it
      tl.to("#s-wed12", { rotationX: 90, transformPerspective: 900, duration: 0.2, ease: "power2.in" }, 4.5);
      tl.set("#wed12-cancel", { opacity: 1 }, 4.7);
      tl.set("#wed12-booked", { opacity: 0 }, 4.7);
      tl.to("#s-wed12", { rotationX: 0, duration: 0.25, ease: "power2.out" }, 4.7);
      cardIn("#card-wait", "#wait-out", 4.95, 5.25);
      fly("#chip3", "#r3", "#mr3", 5.45, 0.5);
      land("#s-wed12", "#wed12-amber", ["#wed12-cancel"], 5.95, "back"); // the one back.out
      cardOut("#card-wait", 6.3);
      settle("#wed12-rebooked", "#wed12-amber", 6.35);

      // Beat 5: week full, and the owner's evening turns warm
      tl.fromTo("#week-full", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: IN }, 6.5);
      tl.to("#wf-tick", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 6.6);
      tl.fromTo("#thu5-fill", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: IN }, 6.6);
      tl.to("#thu5-word", { color: "#0a0a0b", duration: 0.3, ease: "power1.out" }, 6.7);
      tl.fromTo("#thu5-word", { y: 10 }, { y: 0, duration: 0.5, ease: IN }, 6.7);
      tl.set({}, {}, 8); // hold to 8.0 s

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
